# Sandboxed macOS app that checks bookmark behaviour unit tests can't reach.
# Generate with `xcodegen generate`; the .xcodeproj is a build artifact.

name: BookmarksIntegrationHost

options:
  bundleIdPrefix: dev.swiftbookmarks
  deploymentTarget:
    macOS: "15.0"

packages:
  Bookmarks:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BookmarksIntegrationHost:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Bookmarks
        product: Bookmarks
      - package: Bookmarks
        product: BookmarksUI
    entitlements:
      path: Config/BookmarksIntegrationHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.bookmarks.document-scope: true
        com.apple.security.files.downloads.read-write: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Bookmarks Integration Host
        LSApplicationCategoryType: public.app-category.developer-tools

  BookmarksIntegrationHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: BookmarksIntegrationHost
      - package: Bookmarks
        product: Bookmarks
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/BookmarksIntegrationHost.app/Contents/MacOS/BookmarksIntegrationHost
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

schemes:
  BookmarksIntegrationHost:
    build:
      targets:
        BookmarksIntegrationHost: all
        BookmarksIntegrationHostTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BookmarksIntegrationHostTests
