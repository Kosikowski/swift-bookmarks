# Sandboxed macOS app that checks bookmark behaviour unit tests can't reach.
# Generate with `xcodegen generate`; the .xcodeproj is a build artifact.

name: BookmarksIntegrationHost

options:
  bundleIdPrefix: dev.swiftbookmarks
  deploymentTarget:
    macOS: "15.0"

packages:
  Bookmarks:
    path: ..

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES

targets:
  BookmarksIntegrationHost:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Bookmarks
        product: Bookmarks
      - package: Bookmarks
        product: BookmarksUI
    entitlements:
      path: Config/BookmarksIntegrationHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.files.bookmarks.document-scope: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Bookmarks Integration Host
        LSApplicationCategoryType: public.app-category.developer-tools
